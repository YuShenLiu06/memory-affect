[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "memory-affect"
version = "0.1.0"
description = "Host-driven persistent memory recall and three-axis affect, without agent loops"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.8,<3"]
[project.optional-dependencies]
ui = ["streamlit>=1.66.1,<2"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.10", "build>=1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.mypy]
python_version = "3.10"
strict = true
